<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AGY 提示词预设</title>
<style>
body{background:var(--background,#202020);color:var(--foreground,#ededed);font:14px system-ui;margin:24px;max-width:1000px}h1{font-size:22px}label{display:block;margin:16px 0 6px}button,select,input,textarea{font:inherit;background:var(--card,#292929);color:inherit;border:1px solid var(--border,#414141);border-radius:7px;padding:9px;box-sizing:border-box}textarea{width:100%;min-height:340px;font:14px/1.6 Consolas,monospace}button{cursor:pointer}button:hover{background:#353535}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hint{color:var(--muted-foreground,#aaa);line-height:1.7}#status{white-space:pre-wrap;color:#a9c8ff}pre{white-space:pre-wrap;overflow-wrap:anywhere}input[type=checkbox]{margin-right:8px}
</style>
<h1>系统提示词预设</h1><p class="hint" id="capability">预设保存在本机。正在检查原生提示词桥接状态…</p>
<div class="row"><select id="presets" aria-label="预设"></select><button id="new">新建</button><button id="remove">移除预设</button><a href="/" style="color:#b9afff">返回上下文</a></div>
<label for="name">名称</label><input id="name" maxlength="100">
<label for="mode">模式</label><select id="mode"><option value="append">追加</option><option value="replace">完整替换（需要原生桥接）</option></select>
<label for="text">提示词正文</label><textarea id="text" spellcheck="false"></textarea><p class="hint" id="size"></p>
<label><input type="checkbox" id="enabled">启用所选预设</label><button id="save">保存并应用</button><p id="status" role="status"></p>
<details><summary>系统提示词与本地规则来源</summary><button id="sources">读取来源</button><pre id="sourceText"></pre></details>
<details><summary>旧版采集记录（历史）</summary><p class="hint">当前系统提示词优先读取宿主实际请求记录。这里仅保留旧版采集文件供查阅，不代表当前请求。</p><button id="nativeRefresh">刷新历史记录</button><select id="nativeCaptures" aria-label="历史采集记录"></select><button id="nativeRead">查看原文</button><pre id="nativeText"></pre></details>
<script>
const $=id=>document.getElementById(id);let state,selected='',saveError='';
function showSize(){const bytes=new TextEncoder().encode($('text').value).length;$('size').textContent=`${bytes.toLocaleString()} / 524,288 字节`;}
function showApplication(){
  const canApply=Boolean(state.capabilities?.replace);
  $('capability').textContent=canApply?'追加和完整替换均可用。设置作用于后续请求；上下文分类 Token 仍是估算。':'系统提示词读取使用宿主的实际请求记录。预设可以保存；改写尚未就绪，当前不能启用追加或完整替换，也不会自动改用本地规则。';
  const application=state.application||{};
  const messages={applied:'已应用：后续请求使用所选预设。',disabled:'当前未启用提示词预设。',pending:'已保存，等待应用确认。',unavailable:'预设已启用，但当前未应用：'+(application.reason||'原生采集尚未就绪'), 'migration-required':'旧预设尚未应用。请在原生采集就绪后重新保存启用。'};
  $('status').textContent=saveError||messages[application.status]||'正在读取实际应用状态…';
}
function commit(){const p=state.profiles.find(p=>p.id===selected);if(p)Object.assign(p,{name:$('name').value,text:$('text').value,mode:$('mode').value});}
function draw(){ $('presets').replaceChildren(...state.profiles.map(p=>Object.assign(document.createElement('option'),{value:p.id,textContent:p.name})));$('presets').value=selected;const p=state.profiles.find(p=>p.id===selected);$('name').value=p?.name||'';$('text').value=p?.text||'';$('mode').value=p?.mode||'append';$('enabled').checked=state.enabled&&state.activeId===selected;showSize();showApplication(); }
$('presets').onchange=()=>{commit();selected=$('presets').value;draw()};
$('new').onclick=()=>{commit();selected=crypto.randomUUID();state.profiles.push({id:selected,name:'新预设',mode:'append',text:''});draw()};
$('remove').onclick=()=>{state.profiles=state.profiles.filter(p=>p.id!==selected);if(state.activeId===selected){state.enabled=false;state.activeId=''}selected=state.profiles[0]?.id||'';draw()};
$('text').oninput=showSize;
$('save').onclick=async()=>{commit();saveError='';$('save').disabled=true;try{if(new TextEncoder().encode($('text').value).length>512*1024)throw Error('提示词超过 512KB，请缩短正文。');const r=await fetch('/api/prompt-profiles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profiles:state.profiles,enabled:$('enabled').checked,activeId:selected})});const data=await r.json();if(!r.ok)throw Error(data.error||'保存失败');state=data;draw();}catch(e){saveError=e.message;$('status').textContent=saveError}finally{$('save').disabled=false}};
$('sources').onclick=async()=>{try{const cid=new URLSearchParams(location.search).get('conversationId')||'';const r=await fetch('/api/prompt-sources?conversationId='+encodeURIComponent(cid));const data=await r.json();if(!r.ok)throw Error(data.error||'读取失败');$('sourceText').textContent=(data.captured?'已读取实际系统提示词':'尚无完整系统提示词记录')+'\n'+(data.warnings||[]).join('\n')+'\n\n'+data.sources.map(s=>s.kind+'\n'+s.source+'\n'+s.text).join('\n\n')}catch(e){$('sourceText').textContent=e.message}};
$('nativeRefresh').onclick=async()=>{try{const data=await(await fetch('/api/native-prompts')).json();$('nativeCaptures').replaceChildren(...data.captures.map(n=>Object.assign(document.createElement('option'),{value:n,textContent:n})));$('nativeText').textContent='桥接'+(data.status.ready?'在线':'离线')+'；已验证采集：'+Boolean(data.status.captureVerified);}catch(e){$('nativeText').textContent=e.message}};
$('nativeRead').onclick=async()=>{try{if(!$('nativeCaptures').value)return;const r=await fetch('/api/native-prompts?capture='+encodeURIComponent($('nativeCaptures').value));const d=await r.json();if(!r.ok)throw Error(d.error);$('nativeText').textContent='会话：'+(d.conversationId||'未绑定')+'\n采集时间：'+d.capturedAt+'\n模式：'+d.mode+'\n\n'+d.appliedSystem;}catch(e){$('nativeText').textContent=e.message}};
async function loadProfiles(){const response=await fetch('/api/prompt-profiles',{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'读取预设失败');return data;}
loadProfiles().then(data=>{state=data;selected=state.activeId||state.profiles[0]?.id||'';draw()}).catch(e=>$('status').textContent=e.message);
const refresh=setInterval(async()=>{if(!state||$('save').disabled)return;try{const latest=await loadProfiles();state.capabilities=latest.capabilities;if(latest.revision===state.revision)state.application=latest.application;showApplication();}catch(e){$('status').textContent=e.message}},1500);
addEventListener('beforeunload',()=>clearInterval(refresh));
</script></html>
