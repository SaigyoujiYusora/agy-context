<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGY Context</title>
  <style>
    :root {
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --ds-font-family-code: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
      --dsw-font-family-mono: var(--ds-font-family-code);
      --font-mono: var(--ds-font-family-code);

      --ds-transition-duration: 0.16s;
      --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
      --dsw-radius-md: 8px;
      --dsw-focus-ring-color: rgba(77, 107, 254, 0.45);
      --dsw-focus-ring-width: 2px;
      --dsh-content-font-delta: 0px;
      --dsh-frame-top-clearance: 0px;
      --dsh-scrollbar-width: 7px;

      /* Tailwind / Category Color Palette used by dsh-context */
      --color-red-500: #ef4444;
      --color-orange-500: #f97316;
      --color-amber-500: #f59e0b;
      --color-green-500: #22c55e;
      --color-teal-500: #14b8a6;
      --color-blue-500: #3b82f6;
      --color-indigo-500: #6366f1;
      --color-violet-500: #8b5cf6;
      --color-purple-500: #a855f7;
      --color-pink-500: #ec4899;
      --color-slate-400: #94a3b8;
      --color-gray-400: #9ca3af;
      --color-neutral-500: #737373;

      --dsw-static-neutral-bluish-75: #f4f6f9;
      --dsw-static-neutral-1000: #121214;
      --dsw-alias-brand-primary: #4d6bfe;
      --dsw-alias-button-info-fill: #3b82f6;
      --dsw-alias-state-business-primary: #4d6bfe;
      --dsw-alias-state-success-primary: #22c55e;
      --dsw-alias-state-warn-primary: #f59e0b;
      --dsw-alias-state-error-primary: #ef4444;
    }

    /* DeepSeek Harness Dark Theme (matches docs/context-dashboard.png & media_1794533258013_c1dd1d18.png) */
    body[data-ds-dark-theme] {
      color-scheme: dark;
      --dsw-alias-bg-base: #131316;
      --dsw-alias-bg-layer-1: #1b1b1f;
      --dsw-alias-bg-layer-2: #232329;
      --dsw-alias-bg-layer-3: #2b2b33;
      --dsw-alias-bg-mask-1: rgba(0, 0, 0, 0.56);
      --dsw-alias-bg-module-platform: #17171b;

      --dsw-alias-border-l1: rgba(255, 255, 255, 0.16);
      --dsw-alias-border-l2: rgba(255, 255, 255, 0.10);
      --dsw-alias-border-l3: rgba(255, 255, 255, 0.08);
      --dsw-alias-border-l4: rgba(255, 255, 255, 0.13);

      --dsw-alias-label-primary: #f1f2f6;
      --dsw-alias-label-secondary: #a1a6b3;
      --dsw-alias-label-tertiary: #7c818f;
      --dsw-alias-label-dimmed: #626673;
      --dsw-alias-label-primary-foreground: #141417;

      --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.07);
      --dsw-alias-interactive-bg-active: rgba(77, 107, 254, 0.18);
      --dsw-alias-button-primary-fill: #f1f2f6;

      --dsw-shadow-lv1: 0 1px 2px rgba(0, 0, 0, 0.28);
      --dsw-shadow-lv1-blur: 0 1px 3px rgba(0, 0, 0, 0.22);
      --dsw-shadow-lv2: 0 6px 18px rgba(0, 0, 0, 0.36);
      --dsw-shadow-lv3: 0 14px 36px rgba(0, 0, 0, 0.52);

      --agy-composer-bg: #17171b;
      --agy-popover-bg: #1d1d22;
      --agy-pill-bg: #232329;
      --agy-pill-hover: #2c2c34;
    }

    /* DeepSeek Harness Light Theme (matches docs/context-overview.png & docs/fleet-overview.png) */
    body:not([data-ds-dark-theme]) {
      color-scheme: light;
      --dsw-alias-bg-base: #f4f6f9;
      --dsw-alias-bg-layer-1: #ffffff;
      --dsw-alias-bg-layer-2: #f2f4f8;
      --dsw-alias-bg-layer-3: #e7ebf2;
      --dsw-alias-bg-mask-1: rgba(15, 23, 42, 0.36);
      --dsw-alias-bg-module-platform: #ffffff;

      --dsw-alias-border-l1: rgba(15, 23, 42, 0.16);
      --dsw-alias-border-l2: rgba(15, 23, 42, 0.10);
      --dsw-alias-border-l3: rgba(15, 23, 42, 0.08);
      --dsw-alias-border-l4: rgba(15, 23, 42, 0.13);

      --dsw-alias-label-primary: #181a20;
      --dsw-alias-label-secondary: #5a606e;
      --dsw-alias-label-tertiary: #848b99;
      --dsw-alias-label-dimmed: #9ca3af;
      --dsw-alias-label-primary-foreground: #ffffff;

      --dsw-alias-interactive-bg-hover: rgba(15, 23, 42, 0.05);
      --dsw-alias-interactive-bg-active: rgba(77, 107, 254, 0.11);
      --dsw-alias-button-primary-fill: #181a20;

      --dsw-shadow-lv1: 0 1px 2px rgba(15, 23, 42, 0.05);
      --dsw-shadow-lv1-blur: 0 2px 6px rgba(15, 23, 42, 0.04);
      --dsw-shadow-lv2: 0 6px 16px rgba(15, 23, 42, 0.08);
      --dsw-shadow-lv3: 0 14px 36px rgba(15, 23, 42, 0.16);

      --agy-composer-bg: #ffffff;
      --agy-popover-bg: #ffffff;
      --agy-pill-bg: #f1f3f7;
      --agy-pill-hover: #e7ebf2;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body, #app-root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--dsw-alias-bg-base);
      color: var(--dsw-alias-label-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: var(--dsh-scrollbar-width); height: var(--dsh-scrollbar-width); }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--dsw-alias-border-l1);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--dsw-alias-label-tertiary); }

    .mono { font-family: var(--font-mono); }
    .dim { color: var(--dsw-alias-label-tertiary); }

    /* ── Full-Viewport DSH Shell ────────────────────────────────────────── */
    .agy-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--dsw-alias-bg-base);
    }

    /* ── DSH Header + Underline Tab Strip (matches docs/context-overview.png) */
    .dsh-chrome-head {
      flex: none;
      background: var(--dsw-alias-bg-module-platform);
      border-bottom: 1px solid var(--dsw-alias-border-l2);
      padding: 8px 18px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 20;
    }

    .dsh-session-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 30px;
    }

    .dsh-session-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 0;
      overflow: hidden;
    }

    .dsh-session-select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: 0 1 auto;
      min-width: 0;
      max-width: 460px;
    }
    .dsh-session-select {
      appearance: none;
      max-width: 100%;
      padding: 4px 26px 4px 8px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--dsw-alias-label-primary);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      text-overflow: ellipsis;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }
    .dsh-session-select:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      border-color: var(--dsw-alias-border-l2);
    }
    .dsh-session-select option {
      background: var(--dsw-alias-bg-layer-1);
      color: var(--dsw-alias-label-primary);
      font-size: 13px;
      font-weight: 500;
    }
    .dsh-select-caret {
      position: absolute;
      right: 7px;
      pointer-events: none;
      color: var(--dsw-alias-label-secondary);
      display: inline-flex;
    }

    .dsh-meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--dsw-alias-label-secondary);
      background: transparent;
      border: none;
      white-space: nowrap;
    }
    .dsh-meta-chip.is-clickable {
      cursor: pointer;
    }
    .dsh-meta-chip.is-clickable:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    .dsh-session-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    .dsh-chrome-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 7px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: var(--dsw-alias-bg-layer-2);
      color: var(--dsw-alias-label-secondary);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
    }
    .dsh-chrome-btn:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
      border-color: var(--dsw-alias-border-l1);
    }
    .dsh-chrome-btn.is-active {
      background: var(--dsw-alias-interactive-bg-active);
      color: var(--dsw-alias-brand-primary);
      border-color: rgba(77, 107, 254, 0.45);
    }
    .dsh-chrome-btn.mono { font-family: var(--font-mono); font-size: 11.5px; }

    /* Underline Tab Bar matching Chat | Trajectory | Context | Fleet */
    .dsh-tab-strip {
      display: flex;
      align-items: center;
      gap: 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .dsh-tab-strip::-webkit-scrollbar { display: none; }

    .dsh-tab {
      position: relative;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--dsw-alias-label-secondary);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      padding: 6px 2px 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: color 0.15s ease;
    }
    .dsh-tab:hover {
      color: var(--dsw-alias-label-primary);
    }
    .dsh-tab.is-active {
      color: var(--dsw-alias-brand-primary);
      font-weight: 600;
    }
    .dsh-tab.is-active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: var(--dsw-alias-brand-primary);
    }
    .dsh-tab-count {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 0 5px;
      border-radius: 999px;
      background: var(--dsw-alias-bg-layer-2);
      color: var(--dsw-alias-label-secondary);
      line-height: 1.5;
    }
    .dsh-tab.is-active .dsh-tab-count {
      background: rgba(77, 107, 254, 0.16);
      color: var(--dsw-alias-brand-primary);
    }

    /* ── Main Scrollable Viewport ([data-conversation-scroll]) ──────────── */
    .agy-scroll-viewport {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--lc-canvas, var(--dsw-alias-bg-base));
    }
    /* Override dsh-context's nested height:100% overflow scroll lock so outer viewport & useLazyMount work cleanly */
    .agy-scroll-viewport > .lc-root,
    .agy-scroll-viewport > .lc-ov-page,
    .agy-scroll-viewport > .lc-fleet-root {
      height: auto;
      min-height: 100%;
      overflow: visible;
    }
    .agy-scroll-viewport > .lc-ov-page {
      padding: 12px 16px 24px;
    }
    .agy-settings-wrap {
      max-width: 820px;
      margin: 18px auto;
      padding: 0 16px;
    }
    /* Hide upstream DeepSeek Harness groups that do not apply in Antigravity
       (1st: Entry & Visibility, 3rd: System Prompt prefix/suffix) */
    .agy-settings-wrap .lc-settings-prefs > .lc-settings-group:nth-of-type(1),
    .agy-settings-wrap .lc-settings-prefs > .lc-settings-group:nth-of-type(3) {
      display: none;
    }

    /* ── Plugin Version & Update Card (Settings Tab) ────────────────────── */
    .agy-update-card {
      margin-bottom: 14px;
      padding: 13px 16px;
      border-radius: 11px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: var(--dsw-alias-bg-layer-1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .agy-update-card.has-update {
      border-color: rgba(52, 211, 153, 0.40);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.07), var(--dsw-alias-bg-layer-1));
    }
    .agy-update-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .agy-update-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .agy-update-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .agy-update-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--dsw-alias-label-primary);
    }
    .agy-update-ver {
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 1px 6px;
      border-radius: 5px;
      background: var(--dsw-alias-bg-layer-2);
      color: var(--dsw-alias-label-secondary);
      border: 1px solid var(--dsw-alias-border-l2);
    }
    .agy-update-badge {
      font-size: 11.5px;
      font-weight: 500;
      padding: 1px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .agy-update-badge.is-new {
      color: #34d399;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.35);
    }
    .agy-update-badge.is-ok {
      color: var(--dsw-alias-label-secondary);
      background: var(--dsw-alias-bg-layer-2);
      border: 1px solid var(--dsw-alias-border-l2);
    }
    .agy-update-badge.is-err {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.32);
    }
    body:not([data-ds-dark-theme]) .agy-update-badge.is-new {
      color: #047857;
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(5, 150, 105, 0.34);
    }
    body:not([data-ds-dark-theme]) .agy-update-badge.is-err {
      color: #b45309;
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(217, 119, 6, 0.34);
    }
    .agy-update-meta {
      font-size: 11.5px;
      color: var(--dsw-alias-label-tertiary);
    }
    .agy-update-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }
    .agy-update-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: var(--dsw-alias-bg-layer-2);
      color: var(--dsw-alias-label-primary);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.14s ease;
    }
    .agy-update-btn:hover:not(:disabled) {
      background: var(--dsw-alias-interactive-bg-hover);
      border-color: var(--dsw-alias-border-l1);
    }
    .agy-update-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .agy-update-btn.is-primary {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(52, 211, 153, 0.42);
      color: #34d399;
    }
    body:not([data-ds-dark-theme]) .agy-update-btn.is-primary {
      color: #047857;
      border-color: rgba(5, 150, 105, 0.38);
    }
    .agy-update-notes {
      margin: 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--dsw-alias-bg-layer-2);
      border: 1px solid var(--dsw-alias-border-l2);
      color: var(--dsw-alias-label-secondary);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
    }
    .agy-update-cmd-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--dsw-alias-bg-layer-2);
      border: 1px solid var(--dsw-alias-border-l2);
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--dsw-alias-label-primary);
    }
    .agy-update-cmd-row code {
      font-family: inherit;
      overflow-x: auto;
      white-space: nowrap;
    }

    .agy-empty-box {
      padding: 40px 20px;
      text-align: center;
      color: var(--dsw-alias-label-secondary);
      border: 1px dashed var(--dsw-alias-border-l2);
      border-radius: 12px;
      margin: 18px;
      background: var(--dsw-alias-bg-layer-1);
    }
    .agy-slot-error {
      padding: 16px;
      margin: 16px;
      border-radius: 10px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.10);
      color: #fca5a5;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }
    body:not([data-ds-dark-theme]) .agy-slot-error { color: #b91c1c; }

    /* ── Bottom-Docked DSH Composer StatsPills Bar (media_1794533258013_c1dd1d18.png) */
    .dsh-composer-bar {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 7px 16px;
      background: var(--agy-composer-bg);
      border-top: 1px solid var(--dsw-alias-border-l2);
      position: relative;
      z-index: 40;
    }
    .dsh-pills-left, .dsh-pills-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .dsh-model-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--agy-pill-bg);
      border: 1px solid var(--dsw-alias-border-l2);
      flex: none;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }
    .dsh-model-logo svg { display: block; }
    .dsh-model-logo.is-gemini { color: #818cf8; }
    .dsh-model-logo.is-claude { color: #e08b6a; }
    .dsh-model-logo.is-openai { color: #34d399; }
    body:not([data-ds-dark-theme]) .dsh-model-logo.is-gemini { color: #4f46e5; }
    body:not([data-ds-dark-theme]) .dsh-model-logo.is-claude { color: #c25e3c; }
    body:not([data-ds-dark-theme]) .dsh-model-logo.is-openai { color: #059669; }
    .dsh-model-logo.is-warn {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.50);
      color: #f59e0b;
    }
    body[data-ds-dark-theme] .dsh-model-logo.is-warn { color: #fde68a; }
    .dsh-pill-anchor { position: relative; }

    .dsh-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--agy-pill-bg);
      border: 1px solid var(--dsw-alias-border-l2);
      color: var(--dsw-alias-label-primary);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      white-space: nowrap;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }
    .dsh-pill-model {
      background: transparent;
      border-color: transparent;
      padding: 0 8px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
    }
    .dsh-pill-model.is-warn {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.45);
      color: #f59e0b;
    }
    body[data-ds-dark-theme] .dsh-pill-model.is-warn { color: #fde68a; }
    .dsh-spark { color: #818cf8; }

    .dsh-pill-btn, .dsh-pill-toggle { cursor: pointer; }
    .dsh-pill-btn:hover, .dsh-pill-toggle:hover {
      background: var(--agy-pill-hover);
      border-color: var(--dsw-alias-border-l1);
    }
    .dsh-pill-btn.is-open {
      background: var(--dsw-alias-interactive-bg-active);
      border-color: rgba(77, 107, 254, 0.55);
    }
    .dsh-pill-btn.is-approx {
      border-color: rgba(234, 179, 8, 0.55);
      background: rgba(234, 179, 8, 0.14);
      color: #b45309;
    }
